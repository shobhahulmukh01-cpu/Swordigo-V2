name: Manual Pages release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test && npm run check:secrets && npm run build && npm run test:campaign && npm run test:lumen:campaign
      - name: Required browser harness
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo 'Google Chrome is required' >&2; exit 1; }
          export CHROME_BIN="$chrome" CHROME_PATH="$chrome"
          npm run test:browser
      - name: Lumenblade browser and offline checks
        shell: bash
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          node scripts/serve.mjs --port 4173 --base /Swordigo-V2/ > /tmp/lumen-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:4173/Swordigo-V2/ > /dev/null && break; sleep 1; done
          npm run test:lumen:browser
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
