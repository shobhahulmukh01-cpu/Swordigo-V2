name: Release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test && npm run check:secrets && npm run build && npm run test:campaign && npm run test:chapter:earned
      - name: Required browser harness
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$chrome" || { echo 'Google Chrome is required' >&2; exit 1; }
          export CHROME_BIN="$chrome" CHROME_PATH="$chrome"
          npm run test:browser
      - name: Emberwake upgrade and offline checks
        shell: bash
        run: |
          export CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          node scripts/serve.mjs --port 4173 --base /Swordigo-V2/ > /tmp/emberwake-server.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for n in $(seq 1 30); do curl -sf http://127.0.0.1:4173/Swordigo-V2/ > /dev/null && break; sleep 1; done
          python3 tests/browser-smoke.py --base-url http://127.0.0.1:4173/Swordigo-V2/ --output /tmp/emberwake-http-qa
          npm run test:firstload:browser
          npm run test:chapter:browser
          npm run test:upgrade:browser
          npm run test:persistence:browser
          npm run test:update:browser
