name: Release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      EW_EVIDENCE_WORKFLOW: ci
      EW_EVIDENCE_STATE: ${{ github.workspace }}/../emberwake-release-state
      EW_EVIDENCE_RAW: ${{ github.workspace }}/../emberwake-release-raw
      EW_EVIDENCE_OUTPUT: ${{ github.workspace }}/../emberwake-release-evidence
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Initialize isolated release evidence
        run: node scripts/release-evidence.mjs init
      - name: Install dependencies
        run: node scripts/release-evidence.mjs run install
      - name: Required source and earned campaign checks
        shell: bash
        run: |
          node scripts/release-evidence.mjs run unit
          node scripts/release-evidence.mjs run secrets
          node scripts/release-evidence.mjs run build
          node scripts/release-evidence.mjs run artifact-bind
          node scripts/release-evidence.mjs run campaign
          node scripts/release-evidence.mjs run chapter-earned
      - name: Required browser harness
        shell: bash
        run: |
          node scripts/release-evidence.mjs run browser-identity
          node scripts/release-evidence.mjs run browser-harness
      - name: Emberwake upgrade and offline checks
        shell: bash
        run: |
          node scripts/serve.mjs --port 4173 --base /Swordigo-V2/ > /dev/null 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          node scripts/release-evidence.mjs run http-ready
          node scripts/release-evidence.mjs run http-smoke
          node scripts/release-evidence.mjs run firstload
          node scripts/release-evidence.mjs run chapter-browser
          node scripts/release-evidence.mjs run upgrade
          node scripts/release-evidence.mjs run hud
          node scripts/release-evidence.mjs run persistence
          node scripts/release-evidence.mjs run update
      - id: evidence
        name: Finalize artifact-bound release evidence
        if: always()
        env:
          EW_CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          EW_NODE_OUTCOME: ${{ steps.node.outcome }}
        run: node scripts/release-evidence.mjs finalize
      - name: Retain allowlisted release diagnostics
        if: always() && steps.evidence.outputs.upload_safe == 'true'
        # Official tag-to-commit reference checked by parent; provenance in ALPHA5-CI-EVIDENCE.md.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/../emberwake-release-evidence/index.json
            ${{ github.workspace }}/../emberwake-release-evidence/reports.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 9
